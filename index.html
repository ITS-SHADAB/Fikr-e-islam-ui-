  <!-- Dynamic Circular Favicon Generator (cuts out dark square corners to make icon 100% round) -->
  <script>
    (function () {
      var img = new Image();
      img.onerror = function () {
        if (img.src.indexOf('.webp') !== -1) {
          img.src = "/assets/images/logo.jpeg";
        }
      };
      img.onload = function () {
        try {
          var canvas = document.createElement("canvas");
          canvas.width = 128;
          canvas.height = 128;
          var ctx = canvas.getContext("2d");

          // 1. Transparent background, circular clip path
          ctx.beginPath();
          ctx.arc(64, 64, 62, 0, Math.PI * 2, true);
          ctx.closePath();
          ctx.clip();

          // 2. Draw logo image centered
          ctx.drawImage(img, 0, 0, 128, 128);

          // 3. Draw antique gold border ring
          ctx.beginPath();
          ctx.arc(64, 64, 60, 0, Math.PI * 2);
          ctx.strokeStyle = "#A8793E";
          ctx.lineWidth = 4;
          ctx.stroke();

          var roundedDataUrl = canvas.toDataURL("image/png");

          var fav = document.getElementById("app-favicon");
          if (fav) {
            fav.type = "image/png";
            fav.href = roundedDataUrl;
          }

          var apple = document.getElementById("app-apple-icon");
          if (apple) {
            apple.href = roundedDataUrl;
          }
        } catch (e) {
          console.warn("Rounded favicon generation notice:", e);
        }
      };
      img.src = "/assets/images/logo.webp";
    })();
  </script>
